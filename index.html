  :root{

  html,body{margin:0;padding:0;height:100%;}

      var(--paper);

    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    -webkit-tap-highlight-color: transparent;
  }
  .brand{
    display:flex;align-items:center;gap:10px;margin:6px 0 14px;
  }
  .seal{
    width:40px;height:40px;border-radius:6px;background:var(--brick);
    color:var(--paper);display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;box-shadow:var(--shadow);
    font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
    border:2px solid var(--brick-deep);
    transform:rotate(-2deg);

  .brand h1{

  }
  .brand p{margin:0;font-size:12px;color:#6b6155;letter-spacing:0.5px;}

  .stage{
    width:100%;max-width:980px;
    display:grid;
    grid-template-columns: 1.15fr 1fr;
    gap:18px;
    align-items:stretch;
  }
  @media (max-width: 760px){
    .stage{grid-template-columns:1fr;}
  }

  .panel{
    background:#fff8ea;
    border:1px solid var(--paper-deep);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:14px;
    display:flex;
    flex-direction:column;
  }

  /* ---------- 左側：指令欄（狀態/指令/操作/拖曳物品/小抄） ---------- */
  .status-row{display:flex;gap:10px;margin-bottom:10px;}
  .status-chip{
    flex:1;
    background:var(--paper);
    border:1px solid var(--paper-deep);
    border-radius:10px;
    padding:6px 10px;
    text-align:center;
  }
  .status-chip .num{
    font-family:"Noto Serif TC","Songti TC",serif;
    font-size:20px;font-weight:700;
  }
  .status-chip.timer .num{color:var(--jade-deep);}
  .status-chip.err .num{color:var(--brick-deep);}
  .status-chip .lbl{font-size:10.5px;color:#6b6155;letter-spacing:0.5px;}

  .instruction-card{
    background:linear-gradient(180deg,#fff,var(--paper));
    border:1px solid var(--paper-deep);
    border-radius:12px;
    padding:12px;
    min-height:78px;
    display:flex;flex-direction:column;justify-content:center;
    gap:6px;
    position:relative;
    overflow:hidden;
  }
  .instruction-card::before{
    content:"";
    position:absolute;top:-30px;right:-30px;width:90px;height:90px;
    background:radial-gradient(circle, rgba(201,162,39,0.18), transparent 70%);
  }

    width:30px;height:30px;border-radius:50%;

  .instruction-text .py-line{font-size:12px;color:#6b6155;font-style:italic;margin-top:2px;}
  .feedback{

  .feedback.ok{color:var(--jade-deep);}

    border-radius:12px;

    aspect-ratio:1/1;

    border:2px solid #d8c9a3;

    user-select:none;

/* ============ 座標與方位詞（含簡體+拼音） ============ */
// row-major：0=左上角 1=正上方 2=右上角 3=左邊 4=正中間 5=右邊 6=左下角 7=正下方 8=右下角
const ABS_LABEL = [
  {t:"左上角", s:"左上角", py:"zuǒ shàng jiǎo"},
  {t:"正上方", s:"正上方", py:"zhèng shàng fāng"},
  {t:"右上角", s:"右上角", py:"yòu shàng jiǎo"},
  {t:"左邊",   s:"左边",   py:"zuǒ biān"},

  {t:"右邊",   s:"右边",   py:"yòu biān"},
  {t:"左下角", s:"左下角", py:"zuǒ xià jiǎo"},
  {t:"正下方", s:"正下方", py:"zhèng xià fāng"},
  {t:"右下角", s:"右下角", py:"yòu xià jiǎo"}
];
const REL_DIR = {
  "上面": {t:"上面", s:"上面", py:"shàng miàn"},
  "下面": {t:"下面", s:"下面", py:"xià miàn"},
  "左邊": {t:"左邊", s:"左边", py:"zuǒ biān"},
  "右邊": {t:"右邊", s:"右边", py:"yòu biān"}
};
const CONN = {
  ba:     {t:"把",   s:"把",   py:"bǎ"},
  fangdao:{t:"放到", s:"放到", py:"fàng dào"},
  fangzai:{t:"放在", s:"放在", py:"fàng zài"},
  de:     {t:"的",   s:"的",   py:"de"},
  guizi:  {t:"櫃子",  s:"柜子", py:"guì zi"}
};

function rc(i){ return {row: Math.floor(i/3), col: i%3}; }
// 從 fromCell 看向 toCell 的相對方位（僅上下左右，需正交相鄰）
function relDirection(fromI, toI){
  const a = rc(fromI), b = rc(toI);
  if(b.row===a.row-1 && b.col===a.col) return "上面";
  if(b.row===a.row+1 && b.col===a.col) return "下面";
  if(b.col===a.col-1 && b.row===a.row) return "左邊";
  if(b.col===a.col+1 && b.row===a.row) return "右邊";
  return null;
}

/* ============ 狀態 ============ */
let state = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function newGame(){
  const chosenItems = shuffle(POOL).slice(0,9);           // 隨機取 9 樣物品
  const cellOrder = shuffle([0,1,2,3,4,5,6,7,8]);          // 物品對應到哪個格子（隨機配對）
  const answerKey = {};                                    // cellIndex -> item
  chosenItems.forEach((item,i)=>{ answerKey[cellOrder[i]] = item; });
  const instructionOrder = shuffle([0,1,2,3,4,5,6,7,8]);   // 出題（填格）順序

  state = {
    answerKey,
    instructionOrder,
    step: 0,
    filled: {},          // cellIndex -> true
    errors: 0,
    startTime: null,
    timerInterval: null,
    currentTargetCell: null,
    currentTargetItem: null,
    finished: false,
    trayItems: shuffle(chosenItems),
  };
  return state;
}

/* ============ DOM 參照 ============ */
const shelfGrid = document.getElementById('shelfGrid');
const tray = document.getElementById('tray');
const instructionText = document.getElementById('instructionText');
const feedbackEl = document.getElementById('feedback');
const speakerIcon = document.getElementById('speakerIcon');
const timerNum = document.getElementById('timerNum');
const errNum = document.getElementById('errNum');
const startBtn = document.getElementById('startBtn');
const replayBtn = document.getElementById('replayBtn');
const textToggle = document.getElementById('textToggle');
const endOverlay = document.getElementById('endOverlay');
const finalTime = document.getElementById('finalTime');
const finalErrors = document.getElementById('finalErrors');
const restartBtn = document.getElementById('restartBtn');
const legendGrid = document.getElementById('legendGrid');

/* ============ 方位詞小抄（簡體+拼音） ============ */
(function renderLegend(){
  legendGrid.innerHTML = '';
  ABS_LABEL.forEach(l=>{
    const cell = document.createElement('span');
    cell.className = 'cell';
    cell.innerHTML = `${l.s}<span class="py">${l.py}</span>`;
    legendGrid.appendChild(cell);
  });
})();

/* ============ 語音 ============ */
let zhVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v=>v.lang==='zh-TW') ||
            voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('zh')) ||
            null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}
function speak(text, onend){
  if(!('speechSynthesis' in window)){ if(onend) onend(); return; }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-TW';
  if(zhVoice) utter.voice = zhVoice;
  utter.rate = 0.85;
  utter.onstart = ()=> speakerIcon.classList.add('speaking');
  utter.onend = ()=>{ speakerIcon.classList.remove('speaking'); if(onend) onend(); };
  utter.onerror = ()=>{ speakerIcon.classList.remove('speaking'); if(onend) onend(); };
  speechSynthesis.speak(utter);
}

/* ============ 畫面渲染 ============ */
function renderShelf(){
  shelfGrid.innerHTML = '';
  for(let i=0;i<9;i++){
    const cell = document.createElement('div');
    cell.className = 'shelf-cell';
    cell.dataset.cell = i;
    if(state.filled[i]){
      cell.classList.add('filled');
      const img = document.createElement('img');
      img.src = state.answerKey[i].img;
      img.style.width = "80%";
      cell.appendChild(img);
    }
    shelfGrid.appendChild(cell);
  }
}

function renderTray(){
  tray.innerHTML = '';
  state.trayItems.forEach(item=>{
    const tile = document.createElement('div');
    tile.className = 'item-tile';
    tile.dataset.itemId = item.id;
    
    // 改成建立圖片
    const img = document.createElement('img');
    img.src = item.img;
    img.style.width = "80%"; // 設定圖片大小
    tile.appendChild(img);

    tile.setAttribute('aria-label', item.zh);
    if(state.filled_item_ids && state.filled_item_ids.has(item.id)){
      tile.classList.add('placeholder');
    }
    attachDrag(tile);
    tray.appendChild(tile);
  });
}

function updateErrDisplay(){ errNum.textContent = state.errors; }

function startTimer(){
  state.startTime = Date.now();
  state.timerInterval = setInterval(()=>{
    const elapsed = Math.floor((Date.now()-state.startTime)/1000);
    const m = String(Math.floor(elapsed/60)).padStart(2,'0');
    const s = String(elapsed%60).padStart(2,'0');
    timerNum.textContent = `${m}:${s}`;
  }, 250);
}
function stopTimer(){
  clearInterval(state.timerInterval);
}
function elapsedString(){
  const elapsed = Math.floor((Date.now()-state.startTime)/1000);
  const m = String(Math.floor(elapsed/60)).padStart(2,'0');
  const s = String(elapsed%60).padStart(2,'0');
  return `${m}:${s}`;
}

/* ============ 出題邏輯 ============ */
// 回傳 {trad, simp, py} 三種版本：trad 供語音朗讀；simp/py 供「顯示指令文字」使用
function buildInstruction(cellI){
  const item = state.answerKey[cellI];
  state.currentTargetCell = cellI;
  state.currentTargetItem = item;

  // 找出「已完成、且與目標格正交相鄰」的鄰居格
  const neighborCandidates = [];
  Object.keys(state.filled).forEach(fi=>{
    fi = Number(fi);
    const dir = relDirection(fi, cellI);
    if(dir) neighborCandidates.push({cell:fi, dir});
  });

  let trad, simp, py;
  if(neighborCandidates.length > 0 && Math.random() < 0.6){
    const pick = neighborCandidates[Math.floor(Math.random()*neighborCandidates.length)];
    const neighborItem = state.answerKey[pick.cell];
    const dirMeta = REL_DIR[pick.dir];
    trad = `${CONN.ba.t}${item.zh}${CONN.fangzai.t}${neighborItem.zh}${CONN.de.t}${dirMeta.t}。`;
    simp = `${CONN.ba.s}${item.zhs}${CONN.fangzai.s}${neighborItem.zhs}${CONN.de.s}${dirMeta.s}。`;
    py   = `${CONN.ba.py} ${item.py} ${CONN.fangzai.py} ${neighborItem.py} ${CONN.de.py} ${dirMeta.py}。`;
  } else {
    const label = ABS_LABEL[cellI];
    trad = `${CONN.ba.t}${item.zh}${CONN.fangdao.t}${CONN.guizi.t}${CONN.de.t}${label.t}。`;
    simp = `${CONN.ba.s}${item.zhs}${CONN.fangdao.s}${CONN.guizi.s}${CONN.de.s}${label.s}。`;
    py   = `${CONN.ba.py} ${item.py} ${CONN.fangdao.py} ${CONN.guizi.py} ${CONN.de.py} ${label.py}。`;
  }
  return {trad, simp, py};
}

function renderInstructionDisplay(){
  if(textToggle.checked && state && state.currentSentence){
    instructionText.innerHTML =
      `<div class="cn-line">${state.currentSentence.simp}</div>` +
      `<div class="py-line">${state.currentSentence.py}</div>`;
  } else if(state && !state.finished){
    instructionText.textContent = '(Escucha con atención la instrucción de voz…)';
  }
}

function askCurrentStep(){
  const cellI = state.instructionOrder[state.step];
  const sentence = buildInstruction(cellI);
  state.currentSentence = sentence;
  renderInstructionDisplay();
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  replayBtn.disabled = false;
  speak(sentence.trad);
}

function replayCurrent(){
  if(!state || state.finished) return;
  if(state.currentSentence) speak(state.currentSentence.trad);
}

/* ============ 判定與流程推進 ============ */
function handleDrop(itemId, cellI){
  if(!state || state.finished) return;
  const cellEl = shelfGrid.querySelector(`[data-cell="${cellI}"]`);

  if(state.filled[cellI]){
    // 格子已被佔用，視為無效放置，不計入錯誤
    return;
  }

  const targetItem = state.currentTargetItem;
  const targetCell = state.currentTargetCell;

  const itemCorrect = (Number(itemId) === targetItem.id);
  const cellCorrect  = (cellI === targetCell);

  if(itemCorrect && cellCorrect){
    // 成功
    state.filled[cellI] = true;
    if(!state.filled_item_ids) state.filled_item_ids = new Set();
    state.filled_item_ids.add(itemId);
    feedbackEl.textContent = '✔ ¡Correcto!';
    feedbackEl.className = 'feedback ok';
    renderShelf();
    renderTray();
    state.step++;
    if(state.step >= 9){
      finishGame();
    } else {
      setTimeout(askCurrentStep, 500);
    }
  } else {
    // 失敗
    state.errors++;
    updateErrDisplay();
    if(cellEl){
      cellEl.classList.add('shake');
      setTimeout(()=>cellEl.classList.remove('shake'), 400);
    }
    if(!itemCorrect){
      feedbackEl.textContent = '✘ ¡Objeto equivocado!';
    } else {
      feedbackEl.textContent = '✘ ¡Posición equivocada!';
    }
    feedbackEl.className = 'feedback err';
    setTimeout(()=>{
      if(state.currentSentence) speak(state.currentSentence.trad);
    }, 600);
  }
}

function finishGame(){
  state.finished = true;
  stopTimer();
  sendGAEvent('game_complete', {
      'duration_seconds': Math.floor((Date.now()-state.startTime)/1000),
      'error_count': state.errors
    });
  instructionText.textContent = '¡Genial! Ya has ordenado todo.';
  feedbackEl.textContent = '';
  replayBtn.disabled = true;
  speak('太棒了，全部都收好了！');
  finalTime.textContent = elapsedString();
  finalErrors.textContent = state.errors;
  endOverlay.classList.add('show');
}

/* ============ 拖曳（滑鼠 + 觸控 統一用 Pointer Events） ============ */
let dragCtx = null;

function attachDrag(tile){
  tile.addEventListener('pointerdown', (e)=>{
    if(state.finished) return;
    if(tile.classList.contains('placeholder')) return;
    e.preventDefault();
    const rect = tile.getBoundingClientRect();
    dragCtx = {
      tile,
      itemId: Number(tile.dataset.itemId),
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      width: rect.width,
      height: rect.height,
      originParent: tile.parentNode,
      originNext: tile.nextSibling
    };
    tile.setPointerCapture(e.pointerId);
    tile.classList.add('dragging');
    tile.style.width = rect.width+'px';
    tile.style.height = rect.height+'px';
    tile.style.left = rect.left+'px';
    tile.style.top = rect.top+'px';
    // 不搬移 DOM 位置：position:fixed 已可讓物品浮在最上層，
    // 若中途把元素移出原本父層，部分行動裝置會遺失 pointer capture，導致移動/放開事件收不到。
  });

  tile.addEventListener('pointermove', (e)=>{
    if(!dragCtx || dragCtx.tile!==tile) return;
    tile.style.left = (e.clientX - dragCtx.offsetX)+'px';
    tile.style.top  = (e.clientY - dragCtx.offsetY)+'px';

    // 高亮懸停中的櫃子格
    document.querySelectorAll('.shelf-cell').forEach(c=>c.classList.remove('hover-ok'));
    tile.style.visibility = 'hidden';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    tile.style.visibility = 'visible';
    const cell = under ? under.closest('.shelf-cell') : null;
    if(cell && !cell.classList.contains('filled')){
      cell.classList.add('hover-ok');
    }
  });

  tile.addEventListener('pointerup', (e)=>{
    if(!dragCtx || dragCtx.tile!==tile) return;
    document.querySelectorAll('.shelf-cell').forEach(c=>c.classList.remove('hover-ok'));

    tile.style.visibility = 'hidden';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    tile.style.visibility = 'visible';
    const cellEl = under ? under.closest('.shelf-cell') : null;

    // 還原樣式
    tile.classList.remove('dragging');
    tile.style.position = '';
    tile.style.left = '';
    tile.style.top = '';
    tile.style.width = '';
    tile.style.height = '';
    if(dragCtx.originNext){
      dragCtx.originParent.insertBefore(tile, dragCtx.originNext);
    } else {
      dragCtx.originParent.appendChild(tile);
    }

    const itemId = dragCtx.itemId;
    dragCtx = null;

    if(cellEl){
      const cellI = Number(cellEl.dataset.cell);
      handleDrop(itemId, cellI);
    }
  });

  tile.addEventListener('pointercancel', ()=>{
    if(!dragCtx || dragCtx.tile!==tile) return;
    document.querySelectorAll('.shelf-cell').forEach(c=>c.classList.remove('hover-ok'));
    tile.classList.remove('dragging');
    tile.style.position = '';
    tile.style.left = '';
    tile.style.top = '';
    tile.style.width = '';
    tile.style.height = '';
    tile.style.visibility = '';
    dragCtx = null;
  });
}

/* ============ 遊戲開始 / 重新開始 ============ */
function startGame(){
  sendGAEvent('game_start'); // 放入這裡
  newGame();
  renderShelf();
  renderTray();
  updateErrDisplay();
  timerNum.textContent = '00:00';
  endOverlay.classList.remove('show');
  startBtn.disabled = true;
  startTimer();
  askCurrentStep();
}

startBtn.addEventListener('click', startGame);
replayBtn.addEventListener('click', () => {
    sendGAEvent('replay_audio'); // 放入這裡
    replayCurrent();
  });
restartBtn.addEventListener('click', () => {
    sendGAEvent('play_again'); // 放入這裡
    startGame();
  });
textToggle.addEventListener('change', (e) => {
    sendGAEvent('toggle_hint', { 'status': e.target.checked ? 'on' : 'off' }); // 放入這裡
    renderInstructionDisplay();
  });
  
window.addEventListener('beforeunload', () => {
    if (state && !state.finished && state.startTime) {
      sendGAEvent('game_abandoned', { 'step': state.step }); // 放入這裡
    }
  });

/* 初始畫面：先畫出空櫃子預覽 */
(function initPreview(){
  for(let i=0;i<9;i++){
    const cell = document.createElement('div');
    cell.className = 'shelf-cell';
    shelfGrid.appendChild(cell);
  }
})();

})();
</script>
